# US64: Render Blueprint — deploy backend (Web Service) + frontend (Static Site)
services:
  # --- Backend Express ---
  - type: web
    name: agritrentino-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false   # impostata a mano nel dashboard (segreta)
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false   # URL del frontend Render

  # --- Frontend React/Vite (Static Site) ---
  - type: web
    name: agritrentino-web
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # URL del backend Render + /api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html